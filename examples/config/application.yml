spring:
  application:
    name: my-service

traffictape:
  enabled: false
  max-examples-per-scenario: 50
  plateau-after: 6h
  output:
    directory: /tmp/traffic-tape
  capture:
    include:
      methods: [GET, POST, PUT, PATCH, DELETE]
    exclude:
      routes: [/health, /actuator/**]
      content-types: [multipart/form-data]
